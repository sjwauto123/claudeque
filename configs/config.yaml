# 应用配置
app:
  name: "cloudque-api"
  version: "1.0.0"
  mode: "debug"  # debug, release, test
  port: 8080
  aes: 1234567890abcdef

# 数据库配置
database:
  mysql:
    host: "192.168.10.4"
    port: 3308
    username: "root"
    password: "123456"
    database: "cloudque"
    max_idle_conns: 10
    max_open_conns: 100
  redis:
    host: "192.168.10.4"
    port: 6379
    password: "123456"
    db: 5
    pool_size: 10

# JWT 配置
jwt:
  secret: "your-jwt-secret-key-change-in-production"
  expire_hours: 24

# 日志配置
log:
  level: "debug"  # debug, info, warn, error
  filename: "logs/app.log"
  max_size: 100    # MB
  max_backups: 3   # 保留旧文件的最大个数
  max_age: 28      # 保留旧文件的最大天数
  compress: true   # 是否压缩

# CORS 配置
cors:
  enabled: true
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"


# 训练服务器配置
server:
  host: "38.135.24.184:1211"
  root_username: "root"
  base_path: "/data/users"
  timeout: "30s"
  session_timeout: "24h"
  enabled: true

