# 应用配置
app:
  name: "cloudque-api"
  version: "1.0.0"
  mode: "debug"  # debug, release, test
  port: 8080
  aes_secret: 1234567890abcdef


# 数据库配置
database:
  mysql:
    host: "192.168.10.4"
    port: 3308
    username: "root"
    password: "123456"
    database: "cloudque"
    max_idle_conns: 10
    max_open_conns: 100
  redis:
    host: "localhost"
    port: 6379
    password: ""
    db: 5
    pool_size: 10

# JWT 配置
jwt:
  secret: "your-jwt-secret-key-change-in-production"
  expire_hours: 24

# 日志配置
log:
  level: "debug"  # debug, info, warn, error
  filename: "logs/app.log"
  max_size: 100    # MB
  max_backups: 3   # 保留旧文件的最大个数
  max_age: 28      # 保留旧文件的最大天数
  compress: true   # 是否压缩

# CORS 配置
cors:
  enabled: true
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Authorization"


# 训练服务器配置
server:
  host: "38.135.24.184:1211"
  root_username: "root"
  root_password: ""
  private_key_path: "/home/test/id_rsa"   #用于root用户连接的私钥地址
  private_key_passphrase: "" # 私钥密码（如果有）
  base_path: "/home"
  timeout: "30s"
  session_timeout: "24h"
  enabled: true

  #邮箱配置
email:
  host: "smtp.qq.com"
  port: 465
